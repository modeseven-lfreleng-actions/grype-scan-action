---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# grype-scan-action
#
# Scans SBOMs (or a Grype target reference) for known vulnerabilities,
# renders the findings as a table in the job step summary, and decides
# whether the findings gate the workflow.
#
# Gating is computed from the report rather than delegated to Grype's
# --fail-on exit code, because the action also applies bypasses, and an
# exit code cannot express "these findings would gate, but a maintainer
# has suppressed two of them". Computing it here keeps the counts, the
# table and the verdict consistent with one another.
name: "🔎 Grype Vulnerability Scan"
description: >
  Scan SBOMs or an image/directory for vulnerabilities, summarise the
  findings as a table, and gate the workflow with maintainer-controlled
  bypasses.

inputs:
  # --- what to scan (exactly one of sbom / target) ---------------
  sbom:
    description: >
      Path or shell glob matching the SBOM file(s) to scan, for example
      'sbom-cyclonedx.json' or 'sbom-cyclonedx-*.json'. Every match is
      scanned and the worst outcome decides the verdict.
    required: false
    default: ""
  target:
    description: >
      Grype target reference to scan instead of an SBOM, for example
      'registry:alpine:3.20', 'dir:.' or 'docker-archive:image.tar'.
    required: false
    default: ""
  name:
    description: >
      Label for this scan in the summary and annotations, for example a
      component or image name. Defaults to the SBOM or target name.
    required: false
    default: ""

  # --- scan behaviour --------------------------------------------
  fail-on-missing-sbom:
    description: >
      Fail when the sbom pattern matches no file. A security gate that
      passes because a path was mistyped, or because the step producing
      the SBOM failed, is worse than one that fails loudly. Set false
      where producing no SBOM is a valid outcome, such as a build
      permitted to fail.
    required: false
    default: "true"
  fail-on:
    description: >
      Lowest severity that gates the workflow: negligible, low, medium,
      high or critical. Set to 'none' to report without gating.
    required: false
    default: "medium"
  only-fixed:
    description: >
      Report only vulnerabilities that have a fix available. Useful
      where an unfixable advisory would otherwise block every pull
      request until upstream ships a patch.
    required: false
    default: "false"
  ignore-states:
    description: >
      Comma-separated fix states to ignore, from: fixed, not-fixed,
      unknown, wont-fix. Finer-grained alternative to only-fixed.
    required: false
    default: ""
  by-cve:
    description: "Orient results by CVE rather than the original ID"
    required: false
    default: "false"
  sort-by:
    description: >
      Result ordering: risk, severity, epss, kev, package or
      vulnerability.
    required: false
    default: "risk"
  scope:
    description: "Layers to analyse: squashed, all-layers, deep-squashed"
    required: false
    default: ""
  platform:
    description: "Platform specifier for container image targets"
    required: false
    default: ""
  distro:
    description: "Distro to match against, as <distro>[-:@]<version>"
    required: false
    default: ""
  exclude:
    description: "Comma-separated glob expressions to exclude"
    required: false
    default: ""
  add-cpes-if-none:
    description: "Generate CPEs for packages that have none"
    required: false
    default: "false"
  vex:
    description: >
      Comma-separated VEX documents to apply. The standards-based way
      to record 'not affected' decisions alongside the code.
    required: false
    default: ""
  config:
    description: >
      Grype configuration file to use. Treat as untrusted when it comes
      from a pull request head; prefer bypass issues for suppression.
    required: false
    default: ""
  extra-args:
    description: "Additional raw arguments appended to the Grype call"
    required: false
    default: ""
  grype-version:
    description: "Grype version to install; empty uses the installer default"
    required: false
    default: ""
  cache-db:
    description: >-
      How to use the GitHub Actions cache for the Grype vulnerability
      database. 'true' restores the database and saves it whenever the
      current build is not already cached; 'false' disables caching
      entirely; 'restore-only' restores but never saves.

      Entries are keyed on the Grype version, the database source and
      the database build time,
      'grype-db-<version>-<source>-<build-time>', and restores match on
      the 'grype-db-<version>-<source>-' prefix and return the most
      recently *created* entry under it - which is the newest build so
      long as one job writes that prefix, the arrangement the README
      describes. The source segment is a hash of the update
      URL Grype resolves, so a config, GRYPE_DB_UPDATE_URL or an
      auto-detected .grype.yaml that repoints the feed all get their
      own namespace and jobs scanning different databases cannot share
      an entry. Rotating on the build time is what lets the cache be
      refreshed at all: Actions entries are immutable, so a key fixed
      on the version alone can never be replaced once written.

      Use 'restore-only' for concurrent jobs, such as a matrix leg per
      component. Rotation does not help there, because jobs refreshing
      the same new build all derive the same new key and race to write
      it, leaving the losers reporting "Unable to reserve cache". Pair
      it with one job running 'true' to keep the entry current; see
      "Concurrency and the database cache" in the README.

      Caching is skipped, with a warning, when the resolved
      configuration makes an entry unsafe or meaningless: when
      db.auto-update is false, because the database is then pinned or
      preloaded rather than fetched from the feed the key names; when
      db.cache-dir resolves somewhere unsuitable to archive (a home,
      workspace or filesystem root, somewhere not identifiably Grype's
      own such as ~/.ssh, a Windows path, or a value carrying glob
      metacharacters or a newline); when the database
      update URL cannot
      be read, since entries could not then be isolated by feed; when
      extra-args carries a config or profile flag the cache steps
      cannot see; and when a database already on the runner cannot be
      attributed to this run's feed. The scan still runs in each of
      those cases.

      Saving alone is skipped, with the restore still applied, when a
      symbolic link is found beneath the cache directory or the
      provenance marker cannot be written. Symlinked components of the
      path itself are resolved before the checks above rather than
      refused.

      The one exception is a database the recorded marker positively
      identifies as another feed's: that would make the scan report
      results from the wrong vulnerability data, so it is deleted and
      re-fetched from the configured source, and the run fails if
      either step cannot be completed.
    required: false
    default: "true"

  # --- reporting --------------------------------------------------
  output-formats:
    description: "Comma-separated Grype output formats to write"
    required: false
    default: "json,table,sarif"
  output-prefix:
    description: "Filename prefix for report files"
    required: false
    default: "grype-results"
  summary:
    description: "Write a findings table to the job step summary"
    required: false
    default: "true"
  summary-title:
    description: "Heading used for the step summary section"
    required: false
    default: "Grype Vulnerability Scan"
  summary-max-rows:
    description: >
      Maximum table rows per scanned artefact. The step summary has a
      1MB limit, so large result sets truncate with a note pointing at
      the uploaded report.
    required: false
    default: "50"
  summary-on-success:
    description: >
      Write the summary even when nothing gates. Set false to keep the
      run page quiet unless there is something to act on.
    required: false
    default: "true"
  upload-artifact:
    description: "Upload the report files as a workflow artefact"
    required: false
    default: "true"
  artifact-name:
    description: "Name for the uploaded artefact"
    required: false
    default: "grype-scan-results"
  retention-days:
    description: "Retention for the uploaded artefact"
    required: false
    default: "90"

  # --- gating and bypasses ----------------------------------------
  permit-fail:
    description: >
      Report findings and pass the step. A composite action cannot read
      the vars context, so the calling workflow evaluates its own
      repository variable and passes the result here. The README shows
      the expression.
    required: false
    default: "false"
  bypass-enabled:
    description: >
      Honour maintainer-approved bypasses recorded as labelled issues.
    required: false
    default: "true"
  bypass-repository:
    description: >
      Repository holding bypass issues, as owner/name. Empty uses the
      repository running the workflow. Point several repositories at a
      shared one for an organisation-wide bypass list.
    required: false
    default: ""
  bypass-label:
    description: >
      Label that makes a bypass issue effective. The label is the trust
      boundary: applying one needs triage or write permission, so an
      outside contributor cannot approve their own bypass. Identifiers
      come from the title as it stood when the label was last applied,
      so editing the title afterwards changes nothing until a
      maintainer re-applies the label. Authorship is NOT used, because
      author_association reports CONTRIBUTOR rather than MEMBER when
      organisation membership is private.
    required: false
    default: "cve-bypass"
  bypass-title-prefix:
    description: "Issue title prefix identifying a bypass request"
    required: false
    default: "BYPASS:"
  bypass-max-age-days:
    description: >
      Ignore bypass issues older than this many days, so suppressions
      expire rather than accumulate. 0 disables expiry.
    required: false
    default: "90"
  github-token:
    description: >
      Token used to read bypass issues. The read-only token available
      to pull requests from forks is sufficient for a public
      repository. Without it the action falls back to unauthenticated
      reads, which are rate limited.
    required: false
    default: ""

outputs:
  gating:
    description: "'true' when findings gate the workflow"
    value: ${{ steps.evaluate.outputs.gating }}
  total-matches:
    description: "Total matches reported across all scanned artefacts"
    value: ${{ steps.evaluate.outputs.total-matches }}
  gating-matches:
    description: "Matches at or above the threshold, after bypasses"
    value: ${{ steps.evaluate.outputs.gating-matches }}
  bypassed-matches:
    description: "Matches suppressed by an approved bypass"
    value: ${{ steps.evaluate.outputs.bypassed-matches }}
  bypassed-ids:
    description: "Comma-separated vulnerability IDs that were bypassed"
    value: ${{ steps.evaluate.outputs.bypassed-ids }}
  severity-counts:
    description: "JSON object of match counts by severity"
    value: ${{ steps.evaluate.outputs.severity-counts }}
  report-files:
    description: "Newline-separated list of report files written"
    value: ${{ steps.evaluate.outputs.report-files }}

runs:
  using: "composite"
  steps:
    - name: "Validate inputs"
      id: validate
      shell: bash
      env:
        INPUT_SBOM: ${{ inputs.sbom }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SORT_BY: ${{ inputs.sort-by }}
        INPUT_FORMATS: ${{ inputs.output-formats }}
        INPUT_PREFIX: ${{ inputs.output-prefix }}
        INPUT_MAX_ROWS: ${{ inputs.summary-max-rows }}
        INPUT_MAX_AGE: ${{ inputs.bypass-max-age-days }}
        INPUT_CACHE_DB: ${{ inputs.cache-db }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
        INPUT_RETENTION: ${{ inputs.retention-days }}
        INPUT_BYPASS_REPO: ${{ inputs.bypass-repository }}
      run: |
        # Reject contradictory or malformed inputs before installing
        # anything, so a misconfiguration fails in seconds.
        set -euo pipefail

        if [ -z "${INPUT_SBOM}" ] && [ -z "${INPUT_TARGET}" ]; then
          echo "::error::provide either 'sbom' or 'target'"
          exit 1
        fi
        if [ -n "${INPUT_SBOM}" ] && [ -n "${INPUT_TARGET}" ]; then
          echo "::error::'sbom' and 'target' are mutually exclusive"
          exit 1
        fi

        case "${INPUT_FAIL_ON}" in
          negligible|low|medium|high|critical|none) ;;
          *)
            echo "::error::fail-on must be one of negligible, low," \
              "medium, high, critical, none; got '${INPUT_FAIL_ON}'"
            exit 1
            ;;
        esac

        case "${INPUT_SORT_BY}" in
          package|severity|epss|risk|kev|vulnerability) ;;
          *)
            echo "::error::sort-by must be one of package, severity," \
              "epss, risk, kev, vulnerability; got '${INPUT_SORT_BY}'"
            exit 1
            ;;
        esac

        # Rejected rather than coerced: anchore/scan-action treats any
        # value that is not exactly 'true' as false, so a typo such as
        # 'restore_only' would silently disable caching and cost a
        # full database download on every run with nothing to show
        # why.
        #
        # Trimmed and case-folded before validating. The upstream
        # action read this through core.getInput(), which strips
        # surrounding whitespace, and then compared with
        # .toLowerCase() - so values like ' TRUE ' have always worked.
        # A composite receives the input verbatim, so both steps have
        # to be repeated here or this validation would reject inputs
        # that callers are using today.
        cache_db="${INPUT_CACHE_DB#"${INPUT_CACHE_DB%%[![:space:]]*}"}"
        cache_db="${cache_db%"${cache_db##*[![:space:]]}"}"
        cache_db=$(printf '%s' "${cache_db}" \
          | tr '[:upper:]' '[:lower:]')
        case "${cache_db}" in
          true|false|restore-only) ;;
          *)
            echo "::error::cache-db must be one of true, false," \
              "restore-only; got '${INPUT_CACHE_DB}'"
            exit 1
            ;;
        esac

        # 'json' underpins the summary, the gating decision and the
        # bypass filtering, so it is not optional. Strip whitespace
        # first: 'table, json' is as valid as 'json,table'.
        normalised_formats="${INPUT_FORMATS// /}"
        case ",${normalised_formats}," in
          *,json,*) ;;
          *)
            echo "::error::output-formats must include 'json';" \
              "got '${INPUT_FORMATS}'"
            exit 1
            ;;
        esac

        # The prefix becomes a filename and an artefact path.
        if [[ ! "${INPUT_PREFIX}" =~ ^[A-Za-z0-9._-]+$ ]]; then
          echo "::error::output-prefix must match [A-Za-z0-9._-]+;" \
            "got '${INPUT_PREFIX}'"
          exit 1
        fi

        for pair in \
          "summary-max-rows:${INPUT_MAX_ROWS}" \
          "bypass-max-age-days:${INPUT_MAX_AGE}" \
          "retention-days:${INPUT_RETENTION}"
        do
          num_name="${pair%%:*}"
          num_value="${pair#*:}"
          if [[ ! "${num_value}" =~ ^[0-9]+$ ]]; then
            echo "::error::${num_name} must be a whole number;" \
              "got '${num_value}'"
            exit 1
          fi
        done

        if [ -n "${INPUT_BYPASS_REPO}" ] && \
           [[ ! "${INPUT_BYPASS_REPO}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]
        then
          echo "::error::bypass-repository must be 'owner/name';" \
            "got '${INPUT_BYPASS_REPO}'"
          exit 1
        fi

        echo "Inputs validated ✅"

        # extra-args is a raw escape hatch appended to the scan argv,
        # so it can carry Grype's own configuration flags. The cache
        # steps cannot see it, and would then key and refresh one
        # configuration while the scan reads another - an ineffective
        # cache at best, a database from the wrong feed at worst.
        # --profile counts too: a profile can set db.update-url,
        # db.cache-dir or db.auto-update just as a config file can.
        # Caching is switched off rather than the run rejected:
        # passing configuration this way is legal, so the scan keeps
        # working exactly as asked and only the optimisation that
        # cannot account for it is dropped.
        if [ "${cache_db}" != "false" ]; then
          # Every kind of shell whitespace separates arguments once the
          # scan word-splits extra-args, so a tab or a newline puts a
          # flag on its own just as a space does; matching literal
          # spaces alone would miss those.
          extra_args_ws=$(printf '%s' "${INPUT_EXTRA_ARGS}" \
            | tr '[:space:]' ' ')
          # ' -c' without a trailing space or '=', because pflag also
          # accepts a shorthand value attached to its flag: -c cfg,
          # -c=cfg and -ccfg are the same argument to Grype. Long
          # options take no attached form, so those keep both spellings
          # explicitly. No other Grype shorthand begins with c, so this
          # cannot catch an unrelated flag - and erring towards a match
          # only costs the cache, never the scan.
          case " ${extra_args_ws} " in
            *" -c"* | *" --config "* | *" --config="* \
              | *" --profile "* | *" --profile="*)
              echo "::warning::extra-args carries a Grype config or" \
                "profile flag, which the database cache cannot" \
                "account for; disabling the cache for this run. Use" \
                "the 'config' input instead to keep it"
              cache_db="false"
              ;;
          esac
        fi

        # Publish the normalised value so every later step branches on
        # one spelling rather than re-folding the raw input.
        echo "cache-db=${cache_db}" >> "${GITHUB_OUTPUT}"

    - name: "Install Grype"
      id: grype
      # yamllint disable-line rule:line-length
      uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
      with:
        grype-version: ${{ inputs.grype-version }}
        # Caching is owned below, in every mode. Upstream keys the
        # entry on the Grype version alone, and Actions cache entries
        # are immutable, so once that key exists it can never be
        # refreshed: every later run restores a database that is a
        # little more stale, fails to overwrite it, and keeps it alive
        # past normal eviction by reading it.
        cache-db: "false"

    - name: "Resolve Grype DB cache location"
      id: grype-db
      if: steps.validate.outputs.cache-db != 'false'
      shell: bash
      env:
        GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        INPUT_CONFIG: ${{ inputs.config }}
        GRYPE_CHECK_FOR_APP_UPDATE: "false"
      run: |
        set -euo pipefail
        # The same --config the scan uses: a config that moves
        # db.cache-dir would otherwise have this resolve the default
        # directory while the scan reads another, so the entry saved
        # and restored is not the database being scanned against.
        cfg=()
        [ -n "${INPUT_CONFIG}" ] && cfg+=(--config "${INPUT_CONFIG}")
        # ${cfg[@]+"${cfg[@]}"} rather than "${cfg[@]}": under `set -u`,
        # bash 3.2 - which is what macOS ships as /bin/bash - treats an
        # empty array expansion as an unbound variable and aborts. The
        # guarded form expands to nothing when the array is empty and
        # is identical otherwise.
        if [ -n "${INPUT_CONFIG}" ] && [ ! -f "${INPUT_CONFIG}" ]; then
          echo "::error::config not found: ${INPUT_CONFIG}"
          exit 1
        fi
        # One resolved view, read twice. Asking Grype what it resolved
        # covers every way the feed can be repointed at once - the
        # config input, GRYPE_DB_UPDATE_URL, and a .grype.yaml picked
        # up automatically from the repository - none of which are
        # visible from the inputs alone.
        # Declining is a warning, not a failure: each condition below
        # is a property of the caller's configuration rather than a
        # fault, and a cache is an optimisation - the scan must still
        # run. Defined before the first read of Grype's configuration,
        # because that read is itself a condition that can decline.
        decline() {
          echo "::warning::$*; skipping the database cache for" \
            "this run"
          echo "cacheable=false" >> "${GITHUB_OUTPUT}"
          exit 0
        }
        # Tolerated, not assumed: `grype config --load` postdates some
        # releases that grype-version can still pin, and those builds
        # scan perfectly well. Under `set -e` an unguarded assignment
        # would abort the action before the scan for the sake of a
        # cache - so an unavailable configuration view declines like
        # every other condition that makes an entry unsafe.
        resolved=$("${GRYPE_CMD}" ${cfg[@]+"${cfg[@]}"} config --load \
          2>/dev/null) || resolved=""
        if [ -z "${resolved}" ]; then
          decline "this Grype build does not report its resolved" \
            "configuration (grype config --load), so the cache" \
            "cannot be keyed to the database it would hold"
        fi
        # The raw scalar as written, delimiters and all. Unquoting is
        # a separate step because stripping every quote character
        # would corrupt a value that legitimately contains one - a
        # path such as /tmp/grype's/db is a plain YAML scalar, and
        # removing its apostrophe would point the cache at a
        # different directory from the one the scan uses.
        field_raw() {
          printf '%s\n' "${resolved}" \
            | sed -n "s/^[[:space:]]*$1:[[:space:]]*//p" \
            | head -n1
        }
        # Strips only matching outer delimiters, and nothing else: a
        # path such as /tmp/grype's/db is a plain YAML scalar, so
        # removing every quote character would point the cache at a
        # different directory from the one the scan uses. Kept free of
        # decline() because it runs inside a command substitution,
        # where exiting would end only the subshell; the caller
        # validates instead.
        unquote() {
          local v="$1"
          case "${v}" in
            '"'*'"') v="${v#\"}"; v="${v%\"}" ;;
            "'"*"'") v="${v#\'}"; v="${v%\'}"; v="${v//\'\'/\'}" ;;
          esac
          printf '%s' "${v}"
        }
        field() { unquote "$(field_raw "$1")"; }
        canonical() {
          python3 -c 'import os,sys;print(os.path.realpath(sys.argv[1]))' "$1"
        }
        # Read from the same resolved view as cache-dir and
        # update-url, so all three describe one configuration.
        auto_update=$(field auto-update)
        if [ "${auto_update}" = "false" ]; then
          # A caller who disabled auto-update pinned or preloaded a
          # database deliberately. Restoring would overwrite what
          # they pinned, and saving would publish an unidentifiable
          # database into the namespace of a feed it never came
          # from - where an auto-updating run could restore it and
          # keep it, since Grype compares build times and a newer
          # foreign database survives `db update`. A preloaded
          # database is already present, so caching gains nothing.
          decline "db.auto-update is false, so the database is" \
            "pinned or preloaded"
        fi
        dir_raw=$(field_raw cache-dir)
        if [ -z "${dir_raw}" ]; then
          echo "::error::could not resolve the Grype cache directory"
          exit 1
        fi
        # Validated as written, before unquoting. field_raw sees a
        # single physical line, so a scalar Grype wrote across several
        # - a block scalar, or a quoted one left unterminated by the
        # truncation - would leave this action caching a fragment of
        # the path while the scan uses the whole of it. An escape
        # sequence inside a double-quoted scalar is refused for the
        # same reason: "\n" is a newline to Grype and four harmless
        # characters to the checks below.
        case "${dir_raw}" in
          '|'* | '>'*)
            decline "the Grype cache directory is a multiline YAML" \
              "scalar" ;;
        esac
        case "${dir_raw}" in
          '"'*'"')
            case "${dir_raw}" in
              *\\*) decline "the Grype cache directory contains an" \
                      "escape sequence" ;;
            esac
            ;;
          "'"*"'") ;;
          '"'* | "'"*)
            decline "the Grype cache directory is an unterminated" \
              "quoted scalar" ;;
        esac
        dir=$(unquote "${dir_raw}")
        if [ -z "${dir}" ]; then
          echo "::error::could not resolve the Grype cache directory"
          exit 1
        fi
        dir="${dir/#\~/${HOME}}"
        # db.cache-dir is repository-controlled: an auto-detected
        # .grype.yaml can point it anywhere, and whatever it names
        # is archived on save and written back over on restore. A
        # broad path - $HOME, the workspace, a filesystem root -
        # would sweep unrelated files into the entry and restore
        # them into later runs.
        #
        # actions/cache reads `path` as a newline-separated list of
        # @actions/glob patterns, not as one literal path, so a value
        # like "<workspace>/grype/**" would satisfy every check below
        # while archiving whatever the pattern reaches. Refused
        # outright: a genuine cache directory needs none of these.
        # Applied to the raw value and again after canonicalisation,
        # because resolving a symlink can *introduce* this syntax - a
        # tame-looking path pointing at a directory literally named
        # "grype*" would otherwise pass here and be globbed later.
        reject_patterns() {
          case "$1" in
            *[\*\?\[\]\{\}\!\#]*)
              decline "the Grype cache directory contains glob" \
                "metacharacters ($1)" ;;
          esac
          if [ "$1" != "${1//[$'\n\r']/}" ]; then
            decline "the Grype cache directory contains a newline"
          fi
        }
        reject_patterns "${dir}"
        # A Windows-native path - a drive letter or a UNC share -
        # reaches none of the POSIX reasoning below, which assumes a
        # single-rooted tree with '/' separators. Declining says so
        # plainly rather than letting the absolute-path check reject
        # it with a misleading message. Supporting it properly needs
        # Windows-aware canonicalisation and a windows-latest leg in
        # the test workflow to exercise it; shipping untested
        # path-safety logic is not worth the cache it would buy.
        case "${dir}" in
          [A-Za-z]:[\\/]* | \\\\*)
            decline "the Grype database cache does not support" \
              "Windows paths (${dir}); the scan is unaffected" ;;
        esac
        case "${dir}" in
          /*) ;;
          *) decline "the Grype cache directory is not absolute" \
               "(${dir})" ;;
        esac
        # realpath, not a lexical normalisation: actions/cache follows
        # symbolic links, so a symlinked component would otherwise let
        # a path that passes every check below archive somewhere else
        # entirely. Python resolves the components that exist and
        # leaves the rest alone, so this still works on a cold runner
        # where the directory has yet to be created - which GNU
        # realpath needs -m for, and macOS does not have at all.
        dir=$(canonical "${dir}")
        # The canonical path is what actions/cache receives, so it has
        # to clear the pattern checks in its own right.
        reject_patterns "${dir}"
        # Reject the directory itself and any ancestor of a place
        # the run legitimately keeps things in.
        for guard in "${HOME:-}" "${GITHUB_WORKSPACE:-}" \
          "${RUNNER_TEMP:-}"; do
          [ -n "${guard}" ] || continue
          guard=$(canonical "${guard}")
          case "${guard}/" in
            "${dir}"/*)
              decline "the Grype cache directory (${dir})" \
                "contains ${guard}"
              ;;
          esac
        done
        # Backstop for the roots no guard covers, such as /etc or
        # /usr: a dedicated cache directory is never a top-level one.
        case "${dir#/}" in
          */*) ;;
          *) decline "the Grype cache directory is too broad" \
               "(${dir})" ;;
        esac
        # The guards above only stop a path that *contains* somewhere
        # the run keeps things; they would still admit a sensitive
        # directory *inside* one, such as ~/.ssh or ~/.docker. So the
        # leaf itself has to name Grype, with one exception for the
        # standard <...>/grype/db layout. Testing the parent alone
        # would admit ~/.ssh wherever HOME happens to be named for
        # Grype, such as a self-hosted runner using /home/grype. This
        # is a heuristic, which is why it declines rather than fails:
        # an unusual but genuine layout loses the cache and is told
        # why, while a redirected one stops short of being archived.
        leaf=$(printf '%s' "${dir##*/}" | tr '[:upper:]' '[:lower:]')
        rest="${dir%/*}"
        parent=$(printf '%s' "${rest##*/}" \
          | tr '[:upper:]' '[:lower:]')
        case "${leaf}" in
          *grype*) ;;
          db)
            case "${parent}" in
              *grype*) ;;
              *) decline "the Grype cache directory does not look" \
                   "like Grype's own (${dir})" ;;
            esac
            ;;
          *) decline "the Grype cache directory does not look like" \
               "Grype's own (${dir})" ;;
        esac
        # Always read the installed binary rather than the
        # grype-version input. The installer accepts 'latest', which
        # would pin the prefix to the literal string while the binary
        # underneath it moves - and a database cached under one schema
        # could then be restored for a release that cannot read it.
        # The input describes what was requested; only the binary
        # knows what arrived.
        version="v$("${GRYPE_CMD}" version \
          | awk '/^Version:/ {print $2; exit}')"
        if [ "${version}" = "v" ]; then
          echo "::error::could not resolve the installed Grype version"
          exit 1
        fi
        # Namespaced by the feed the database will actually come
        # from. Two jobs pointing at different feeds must not share a
        # prefix: Grype decides whether to update by comparing build
        # times, so a newer database from the wrong feed survives
        # `db update` and the scan silently uses it.
        #
        # Hashed with whichever digest tool the runner has:
        # sha256sum is GNU coreutils and absent on macOS, which ships
        # shasum instead. Checking both keeps this working on every
        # runner OS without adding a dependency.
        sha256() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum
          else
            shasum -a 256
          fi
        }
        update_url=$(field update-url)
        if [ -z "${update_url}" ]; then
          # No namespace means every feed shares one prefix, which is
          # exactly the cross-feed contamination the source segment
          # exists to prevent - and it would bite hardest here, where
          # the configuration is unusual enough that the URL could not
          # be read. Declining keeps the scan working without that
          # risk, which a shared 'default' namespace would not.
          decline "the Grype database update-url could not be" \
            "resolved, so cache entries cannot be namespaced by feed"
        fi
        source_id=$(printf '%s' "${update_url}" | sha256 | cut -c1-12)
        echo "Grype DB cache dir:    ${dir}"
        echo "Grype DB cache prefix: grype-db-${version}-${source_id}-"
        {
          echo "cacheable=true"
          echo "dir=${dir}"
          echo "source-id=${source_id}"
          echo "prefix=grype-db-${version}-${source_id}-"
        } >> "${GITHUB_OUTPUT}"

    - name: "Restore Grype DB from cache"
      id: grype-db-restore
      if: steps.grype-db.outputs.cacheable == 'true'
      # Prefix restore rather than an exact key: the entry carries the
      # database build time, which cannot be known until the database
      # is in hand. `key` is the bare prefix, which never exists as a
      # complete entry, so the lookup falls through to restore-keys
      # and returns the most recent build available.
      # yamllint disable-line rule:line-length
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.grype-db.outputs.dir }}
        key: ${{ steps.grype-db.outputs.prefix }}
        restore-keys: ${{ steps.grype-db.outputs.prefix }}

    - name: "Refresh the Grype DB"
      id: grype-db-refresh
      # Runs for 'restore-only' as well as 'true'. Only the save is
      # exclusive to 'true'; the provenance check below guards what the
      # scan reads, which matters just as much to a caller that never
      # writes the cache.
      if: steps.grype-db.outputs.cacheable == 'true'
      shell: bash
      env:
        GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        PREFIX: ${{ steps.grype-db.outputs.prefix }}
        DIR: ${{ steps.grype-db.outputs.dir }}
        SOURCE_ID: ${{ steps.grype-db.outputs.source-id }}
        CACHE_DB: ${{ steps.validate.outputs.cache-db }}
        INPUT_CONFIG: ${{ inputs.config }}
        MATCHED_KEY: ${{ steps.grype-db-restore.outputs.cache-matched-key }}
        GRYPE_CHECK_FOR_APP_UPDATE: "false"
      run: |
        set -euo pipefail
        cfg=()
        [ -n "${INPUT_CONFIG}" ] && cfg+=(--config "${INPUT_CONFIG}")
        build_time() {
          # The whole value after "Built:", not just the first field.
          # Newer Grype emits RFC3339 (2026-09-03T06:30:55Z) where one
          # field is the entire timestamp, but older releases - which
          # grype-version can still pin - emit
          # "2024-07-25 01:30:47 +0000 UTC", where taking one field
          # yields the date alone and collapses every build that day
          # onto a single key. That is precisely the staleness the
          # rotating key exists to prevent.
          "${GRYPE_CMD}" ${cfg[@]+"${cfg[@]}"} db status 2>/dev/null \
            | sed -n 's/^Built:[[:space:]]*//p' | head -n1 || true
        }
        db_usable() {
          # Grype prints Built: even for a database it considers
          # invalid - a checksum mismatch, or one aged past its limit
          # - and signals that only through the exit status. Reading
          # the timestamp alone would let a corrupt database be cached
          # under a perfectly valid-looking key and handed to every
          # later run.
          "${GRYPE_CMD}" ${cfg[@]+"${cfg[@]}"} db status >/dev/null 2>&1
        }
        # Reduced to an alphanumeric run so the key stays legible and
        # safe whichever timestamp format the binary produced; the
        # value itself is what makes it unique per published build.
        stamp_of() { printf '%s' "$1" | tr -cd 'A-Za-z0-9'; }
        # sha256sum is GNU coreutils and absent on macOS, which ships
        # shasum instead; checking both keeps this working on every
        # runner OS without adding a dependency.
        sha256() {
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum
          else
            shasum -a 256
          fi
        }
        # Grype names the archive it installed, including a
        # ?checksum=sha256:... parameter, so this identifies the
        # database's *contents* and the feed it came from - not the
        # files that happen to sit around it. Preferred over hashing
        # the directory: sizes and names cannot distinguish two
        # databases of equal length, and anything finer would change
        # with Grype's own update-check bookkeeping, which lives in
        # the same directory and is rewritten every run.
        db_identity() {
          # || true for the same reason as build_time: `db status`
          # exits non-zero for a database Grype rejects, and under
          # pipefail that would abort the step rather than let the
          # invalid-database handling below report it properly.
          "${GRYPE_CMD}" ${cfg[@]+"${cfg[@]}"} db status 2>/dev/null \
            | sed -n 's/^From:[[:space:]]*//p' | head -n1 || true
        }
        before=$(build_time)
        if ! "${GRYPE_CMD}" ${cfg[@]+"${cfg[@]}"} db update; then
          # Tolerated, not enforced. `db update` forces a check, so a
          # transient feed outage would otherwise fail the action here
          # even though a perfectly usable database was restored and
          # the scan could have run against it. Refreshing the cache
          # is an optimisation; failing the scan for it is not a trade
          # worth making.
          echo "::warning::Grype database update failed; continuing" \
            "with the database already present"
        fi
        after=$(build_time)
        if [ -z "${after}" ]; then
          # No database at all: the scan cannot run, so this is fatal
          # in a way a failed refresh is not.
          echo "::error::no usable Grype database after update"
          exit 1
        fi
        # Which source last populated this directory, and which build
        # it left behind, recorded by the save below. Grype does not
        # record where its database came from, and the directory is
        # shared by every invocation on the runner, so without this a
        # run cannot tell its own database from another feed left
        # behind.
        #
        # The build is recorded alongside the source because the
        # source alone would go stale: anything that replaces the
        # database without writing the marker - a direct Grype call, a
        # scan with cache-db false, the scan step's own auto-update -
        # leaves the old source named against a database it no longer
        # describes. Requiring the recorded build to match the one in
        # hand makes such a replacement visible, because a database
        # from elsewhere carries a different build time.
        # Hashed once, from the identity Grype reports for whatever is
        # now installed. Empty when the build is too old to report it,
        # which leaves the database unattributable rather than letting
        # every such database share one identity.
        db_ref=$(db_identity)
        db_fp=""
        if [ -n "${db_ref}" ]; then
          db_fp=$(printf '%s' "${db_ref}" | sha256 | cut -c1-16)
        fi
        marker="${DIR}/.grype-scan-action-source"
        marker_val=$(cat "${marker}" 2>/dev/null || true)
        # The marker holds "<source> <build> <fingerprint>". Split so
        # each field can be judged on its own: the source says whose
        # database it was, and the build and fingerprint together say
        # whether it is still that database.
        marker_source="${marker_val%% *}"
        marker_rest="${marker_val#* }"
        marker_stamp="${marker_rest%% *}"
        marker_fp="${marker_rest##* }"
        # A marker naming a *different* source is only evidence of a
        # foreign database while it still describes the database in
        # hand - so the recorded build must match too, exactly as the
        # save decision requires. A marker left behind by feed A after
        # something else replaced the directory with feed B's database
        # names A against a build it no longer describes; treating
        # that as proof of a foreign database would delete a perfectly
        # good one, and during a feed outage the deletion would be
        # followed by a failed update and a run that need not have
        # failed. Without the build match this is merely
        # unattributable, which the save decision below handles.
        if [ "${before}" = "${after}" ] && [ -z "${MATCHED_KEY}" ] \
          && [ -n "${marker_val}" ] \
          && [ "${marker_source}" != "${SOURCE_ID}" ] \
          && [ "${marker_stamp}" = "$(stamp_of "${after}")" ] \
          && [ -n "${db_fp}" ] && [ "${marker_fp}" = "${db_fp}" ]; then
          echo "::warning::the database present was left by a" \
            "different feed; replacing it from this run's configured" \
            "source"
          if ! "${GRYPE_CMD}" ${cfg[@]+"${cfg[@]}"} db delete; then
            # Fatal, and checked before the update rather than after:
            # a failed delete leaves the foreign database in place,
            # where `db update` can succeed without replacing a build
            # newer than the configured feed's. The run would then
            # mark and cache that database as this source's own and
            # scan against it - the outcome this branch exists to
            # prevent.
            echo "::error::could not remove another feed's Grype" \
              "database; refusing to scan against it"
            exit 1
          fi
          if ! "${GRYPE_CMD}" ${cfg[@]+"${cfg[@]}"} db update; then
            # Fatal, unlike the tolerated refresh above: there the
            # database left in place was usable, whereas here it is
            # known to be another feed's. Reporting a scan against it
            # would be worse than not scanning at all.
            echo "::error::could not replace the database from this" \
              "run's configured source; refusing to scan against" \
              "another feed's vulnerability data"
            exit 1
          fi
          before=""
          after=$(build_time)
          if [ -z "${after}" ]; then
            echo "::error::no usable Grype database after replacement"
            exit 1
          fi
          # The identity was read before the delete, so it still
          # describes the database just removed. Re-read it, or the
          # marker would bind this source and build to the departed
          # feed's fingerprint - leaving a later run unable to
          # recognise its own database, and unable to recognise a
          # genuinely foreign one as foreign.
          db_ref=$(db_identity)
          db_fp=""
          if [ -n "${db_ref}" ]; then
            db_fp=$(printf '%s' "${db_ref}" | sha256 | cut -c1-16)
          fi
        fi
        if ! db_usable; then
          echo "::warning::Grype reports the database as invalid;" \
            "leaving the cache untouched"
          echo "save=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        stamp=$(stamp_of "${after}")
        if [ -z "${stamp}" ]; then
          echo "::error::unusable Grype database build time: ${after}"
          exit 1
        fi
        echo "restored build: ${before:-<none>}"
        echo "current build:  ${after}"
        stake="${SOURCE_ID} ${stamp} ${db_fp}"
        # Whether this run can vouch for the database: it fetched it,
        # it restored it from this source's own prefix, or the marker
        # still names this source and this exact build. Attestation is
        # about provenance rather than caching, so it is recorded even
        # when nothing is saved - a restore-only leg leaves the
        # directory attributable for the writer that follows it.
        attested=false
        if [ "${before}" != "${after}" ] || [ -n "${MATCHED_KEY}" ]; then
          # This run fetched the database, or restored it from this
          # source's own prefix, so its provenance is known first-hand
          # and needs no marker to vouch for it.
          attested=true
        elif [ -n "${db_fp}" ] && [ "${marker_val}" = "${stake}" ]; then
          # Already present, and the marker still names this source,
          # this build and this database. An identity Grype cannot
          # report is not accepted here: every such database would
          # otherwise share one blank identity and vouch for the next.
          attested=true
        fi
        save=true
        if [ "${attested}" != "true" ]; then
          # Nothing restored, the update moved nothing, and the marker
          # does not vouch for this exact build. Not proof of a
          # foreign database - the case above catches that - but
          # nothing attests it either, so it is not published under
          # this source's prefix for later runs to scan against.
          echo "::warning::the database already present cannot be" \
            "attributed to this run's feed; leaving the cache" \
            "untouched"
          save=false
        elif [ "${before}" = "${after}" ] && [ -n "${MATCHED_KEY}" ]; then
          # Restored from this source's own prefix and unchanged, so
          # the entry already holds this build and a save would
          # collide with it.
          echo "Cache already holds this build; nothing to save"
          save=false
        fi
        # A link beneath the directory stops the save. This is a
        # conservative restriction of this action's own, not a
        # property of actions/cache: Grype's database directory holds
        # no links, so refusing one costs nothing and keeps the entry
        # unambiguous about what it contains - both when written and
        # when later restored over a runner. The path itself is
        # canonicalised when resolved; this covers links created
        # inside it since.
        #
        # No -quit, which not every find provides, and the scan's exit
        # status is honoured rather than discarded: a check that
        # cannot run must not read as "no links found". Both failure
        # modes leave the cache alone.
        if [ "${save}" = "true" ]; then
          if ! link_scan=$(find "${DIR}" -type l 2>/dev/null); then
            echo "::warning::could not scan the Grype cache" \
              "directory for symbolic links; leaving the cache" \
              "untouched"
            save=false
          elif [ -n "${link_scan}" ]; then
            echo "::warning::the Grype cache directory contains a" \
              "symbolic link; leaving the cache untouched"
            save=false
          fi
        fi
        if [ "${attested}" = "true" ] && [ -n "${db_fp}" ]; then
          # Written through a fresh file and renamed into place, never
          # redirected straight at the marker: a redirect follows an
          # existing symlink and writes to its target, leaving the
          # link intact. The symlink sweep above only decides whether
          # to save, and an attested cache hit or a restore-only run
          # reaches here regardless, so this write has to be safe on
          # its own. rm first, so the temporary name cannot be a
          # planted link either; mv replaces the marker itself.
          #
          # Every step is guarded, because none of them is worth
          # aborting a run over: the database is usable, and a marker
          # that cannot be written costs only the cache. A directory
          # sitting on the reserved name is left alone rather than
          # removed - declining is enough, and this action has no
          # business deleting a directory it did not create.
          marker_tmp="${marker}.tmp.$$"
          if [ -d "${marker}" ] && [ ! -L "${marker}" ]; then
            echo "::warning::the provenance marker path is a" \
              "directory; leaving the cache untouched"
            save=false
          elif rm -f "${marker_tmp}" 2>/dev/null \
            && printf '%s\n' "${stake}" > "${marker_tmp}" 2>/dev/null \
            && rm -f "${marker}" 2>/dev/null \
            && mv -f "${marker_tmp}" "${marker}" 2>/dev/null; then
            :
          else
            echo "::warning::could not record database provenance" \
              "at ${marker}; leaving the cache untouched"
            rm -f "${marker_tmp}" 2>/dev/null || true
            save=false
          fi
        fi
        if [ "${CACHE_DB}" != "true" ]; then
          # restore-only reads the cache and never writes it. Reached
          # only after the provenance work above, which this mode needs
          # as much as any other.
          save=false
        fi
        echo "save=${save}" >> "${GITHUB_OUTPUT}"
        echo "key=${PREFIX}${stamp}" >> "${GITHUB_OUTPUT}"

    - name: "Save the Grype DB to cache"
      if: >-
        steps.validate.outputs.cache-db == 'true'
        && steps.grype-db.outputs.cacheable == 'true'
        && steps.grype-db-refresh.outputs.save == 'true'
      # The build time in the key is what makes this work: each
      # published database gets its own entry, so a save never has to
      # overwrite an existing one, and the prefix restore above finds
      # the most recently created of them - the newest build, given
      # the single writer per source that the README requires.
      #
      # Concurrent callers still collide here, because they would be
      # writing the same new key. That is what 'restore-only' is for -
      # see "Concurrency and the database cache" in the README.
      # yamllint disable-line rule:line-length
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ${{ steps.grype-db.outputs.dir }}
        key: ${{ steps.grype-db-refresh.outputs.key }}

    - name: "Run Grype"
      id: scan
      shell: bash
      env:
        GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
        # Grype checks for a newer release on every invocation, which
        # reaches toolbox-data.anchore.io. The version is pinned by the
        # installer, so the call adds egress surface and a failure mode
        # without changing what runs.
        GRYPE_CHECK_FOR_APP_UPDATE: "false"
        INPUT_SBOM: ${{ inputs.sbom }}
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_FAIL_ON_MISSING: ${{ inputs.fail-on-missing-sbom }}
        INPUT_PREFIX: ${{ inputs.output-prefix }}
        INPUT_FORMATS: ${{ inputs.output-formats }}
        INPUT_ONLY_FIXED: ${{ inputs.only-fixed }}
        INPUT_IGNORE_STATES: ${{ inputs.ignore-states }}
        INPUT_BY_CVE: ${{ inputs.by-cve }}
        INPUT_SORT_BY: ${{ inputs.sort-by }}
        INPUT_SCOPE: ${{ inputs.scope }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_DISTRO: ${{ inputs.distro }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_ADD_CPES: ${{ inputs.add-cpes-if-none }}
        INPUT_VEX: ${{ inputs.vex }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        # Scan each artefact, writing one report set per artefact.
        # --fail-on is deliberately not passed: the gate is computed
        # from the JSON in the evaluate step, which also applies
        # bypasses. Grype's exit code is still checked so a genuine
        # tool failure (as opposed to "found vulnerabilities") stops
        # the run.
        set -uo pipefail

        # only-fixed is deliberately NOT passed to Grype: that would
        # drop unfixable findings from the report, and they still need
        # reporting. The evaluate step applies it to the gating subset
        # instead, so the summary shows everything while the verdict
        # rests on what a dependency bump can actually clear.
        args=()
        [ "${INPUT_BY_CVE}" = "true" ] && args+=(--by-cve)
        [ "${INPUT_ADD_CPES}" = "true" ] && args+=(--add-cpes-if-none)
        [ -n "${INPUT_IGNORE_STATES}" ] &&
          args+=(--ignore-states "${INPUT_IGNORE_STATES}")
        [ -n "${INPUT_SORT_BY}" ] &&
          args+=(--sort-by "${INPUT_SORT_BY}")
        [ -n "${INPUT_SCOPE}" ] && args+=(--scope "${INPUT_SCOPE}")
        [ -n "${INPUT_PLATFORM}" ] &&
          args+=(--platform "${INPUT_PLATFORM}")
        [ -n "${INPUT_DISTRO}" ] && args+=(--distro "${INPUT_DISTRO}")
        [ -n "${INPUT_CONFIG}" ] && args+=(--config "${INPUT_CONFIG}")
        if [ -n "${INPUT_EXCLUDE}" ]; then
          IFS=',' read -ra excludes <<< "${INPUT_EXCLUDE}"
          for item in "${excludes[@]}"; do
            [ -n "${item}" ] && args+=(--exclude "${item}")
          done
        fi
        if [ -n "${INPUT_VEX}" ]; then
          IFS=',' read -ra vexes <<< "${INPUT_VEX}"
          for item in "${vexes[@]}"; do
            [ -n "${item}" ] && args+=(--vex "${item}")
          done
        fi
        if [ -n "${INPUT_EXTRA_ARGS}" ]; then
          # Word-split deliberately: this is the escape hatch for
          # flags the action does not model.
          # shellcheck disable=SC2206
          extra=(${INPUT_EXTRA_ARGS})
          args+=("${extra[@]}")
        fi

        # Enumerate the artefacts to scan.
        declare -a artefacts=()
        if [ -n "${INPUT_TARGET}" ]; then
          artefacts+=("${INPUT_TARGET}")
        else
          # Expand the pattern without word splitting, so a path
          # containing spaces stays one pattern.
          shopt -s nullglob
          mapfile -t matches < <(
            compgen -G "${INPUT_SBOM}" || true
          )
          shopt -u nullglob
          if [ "${#matches[@]}" -eq 0 ]; then
            echo "no-artefacts=true" >> "$GITHUB_OUTPUT"
            if [ "${INPUT_FAIL_ON_MISSING}" = "true" ]; then
              # Fail closed: scanning nothing is indistinguishable
              # from scanning something clean, and a mistyped path or
              # a failed SBOM step would otherwise pass the gate.
              echo "::error::No SBOM matched '${INPUT_SBOM}'." \
                "Set fail-on-missing-sbom: false where producing no" \
                "SBOM is a valid outcome."
              exit 1
            fi
            echo "::warning::No SBOM matched '${INPUT_SBOM}'"
            exit 0
          fi
          for match in "${matches[@]}"; do
            artefacts+=("sbom:${match}")
          done
        fi

        IFS=',' read -ra formats <<< "${INPUT_FORMATS}"
        index=0
        manifest=""
        for artefact in "${artefacts[@]}"; do
          # Derive a stable, filename-safe slug per artefact so that
          # scanning several SBOMs does not overwrite one report set.
          raw="${artefact#sbom:}"
          raw="$(basename "${raw}")"
          slug="$(printf '%s' "${raw}" | tr -c 'A-Za-z0-9._-' '_')"
          if [ "${#artefacts[@]}" -eq 1 ]; then
            base="${INPUT_PREFIX}"
          else
            # The index keeps the name unique: two SBOMs in different
            # directories can share a basename, and distinct names can
            # sanitise to the same slug. Without it the second scan
            # overwrites the first and the manifest points both
            # artefacts at one report.
            base="${INPUT_PREFIX}-${index}-${slug}"
          fi

          out_args=()
          for fmt in "${formats[@]}"; do
            fmt="${fmt// /}"
            [ -z "${fmt}" ] && continue
            case "${fmt}" in
              json) out_args+=(-o "json=${base}.json") ;;
              table) out_args+=(-o "table=${base}.txt") ;;
              sarif) out_args+=(-o "sarif=${base}.sarif") ;;
              cyclonedx) out_args+=(-o "cyclonedx=${base}.cdx.xml") ;;
              cyclonedx-json)
                out_args+=(-o "cyclonedx-json=${base}.cdx.json") ;;
              *)
                echo "::error::Unsupported output format '${fmt}'"
                exit 1
                ;;
            esac
          done

          echo "::group::Grype ${artefact}"
          "${GRYPE_CMD}" "${args[@]}" "${out_args[@]}" "${artefact}"
          grype_exit=$?
          if [ -f "${base}.txt" ]; then
            cat "${base}.txt"
          fi
          echo "::endgroup::"

          # Without --fail-on, Grype exits 0 on success. Anything else
          # is a tool failure and must surface.
          if [ "${grype_exit}" != "0" ]; then
            echo "::error::Grype exited with code ${grype_exit} for" \
              "${artefact}"
            exit "${grype_exit}"
          fi

          manifest="${manifest}${base}.json|${artefact}"$'\n'
          index=$((index + 1))
        done

        delimiter="ghadelim_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
        while [[ "${manifest}" == *"${delimiter}"* ]]; do
          delimiter="ghadelim_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
        done
        {
          printf '%s<<%s\n' 'manifest' "${delimiter}"
          printf '%s\n' "${manifest}"
          printf '%s\n' "${delimiter}"
        } >> "$GITHUB_OUTPUT"
        echo "no-artefacts=false" >> "$GITHUB_OUTPUT"

    - name: "Collect approved bypasses"
      id: bypasses
      # yamllint disable-line rule:line-length
      if: ${{ inputs.bypass-enabled == 'true' && steps.scan.outputs.no-artefacts != 'true' }}
      shell: bash
      env:
        BYPASS_REPO: ${{ inputs.bypass-repository || github.repository }}
        BYPASS_LABEL: ${{ inputs.bypass-label }}
        BYPASS_PREFIX: ${{ inputs.bypass-title-prefix }}
        BYPASS_MAX_AGE: ${{ inputs.bypass-max-age-days }}
        GH_TOKEN: ${{ inputs.github-token }}
        API_URL: ${{ github.api_url }}
      run: |
        # Read maintainer-approved bypasses from labelled issues.
        #
        # The LABEL is the trust boundary, not the issue author:
        # applying a label needs triage or write permission, whereas
        # anyone can open an issue. Authorship would be unreliable in
        # any case, because author_association reports CONTRIBUTOR
        # rather than MEMBER when organisation membership is private,
        # and the value varies with the token used to read it.
        #
        # The label authorises the issue, but an author can edit their
        # own title afterwards, so the identifiers are read from the
        # revision current when the label went on, reconstructed from
        # the issue's rename events. Those are paginated, so this costs
        # at least one extra API call per candidate issue, and up to
        # ten where its history is long.
        #
        # Lookup failures leave the bypass list empty, so a broken or
        # rate-limited API keeps the gate closed rather than opening
        # it silently.
        set -uo pipefail
        PYTHONPATH="${GITHUB_ACTION_PATH}" python3 -m scripts.collect_bypasses

    - name: "Evaluate findings"
      id: evaluate
      if: ${{ always() && steps.scan.outputs.no-artefacts != 'true' }}
      shell: bash
      env:
        MANIFEST: ${{ steps.scan.outputs.manifest }}
        BYPASSES: ${{ steps.bypasses.outputs.bypasses }}
        INPUT_NAME: ${{ inputs.name }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_SUMMARY_TITLE: ${{ inputs.summary-title }}
        INPUT_SUMMARY_MAX_ROWS: ${{ inputs.summary-max-rows }}
        INPUT_SUMMARY_ON_SUCCESS: ${{ inputs.summary-on-success }}
        INPUT_ONLY_FIXED: ${{ inputs.only-fixed }}
        BYPASS_REPO: ${{ inputs.bypass-repository || github.repository }}
      run: |
        # Turn the JSON report(s) into a table, counts and a verdict.
        set -uo pipefail
        PYTHONPATH="${GITHUB_ACTION_PATH}" python3 -m scripts.evaluate

    - name: "Upload reports"
      # yamllint disable-line rule:line-length
      if: ${{ always() && inputs.upload-artifact == 'true' && steps.scan.outputs.no-artefacts != 'true' }}
      # yamllint disable-line rule:line-length
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.evaluate.outputs.report-files }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: warn

    - name: "Apply verdict"
      if: ${{ always() && steps.scan.outputs.no-artefacts != 'true' }}
      shell: bash
      env:
        GATING: ${{ steps.evaluate.outputs.gating }}
        GATING_MATCHES: ${{ steps.evaluate.outputs.gating-matches }}
        BYPASSED: ${{ steps.evaluate.outputs.bypassed-matches }}
        PERMIT_FAIL: ${{ inputs.permit-fail }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        # Fail the step last, so the summary and artefacts are already
        # in place when the run goes red.
        set -euo pipefail

        if [ "${BYPASSED}" != "0" ]; then
          echo "::notice::${BYPASSED} finding(s) suppressed by an" \
            "approved bypass issue"
        fi

        if [ "${GATING}" != "true" ]; then
          echo "No findings at or above '${FAIL_ON}' ✅"
          exit 0
        fi

        if [ "${PERMIT_FAIL}" = "true" ]; then
          echo "::warning::${GATING_MATCHES} finding(s) at or above" \
            "'${FAIL_ON}', but permit-fail is set so the step passes"
          exit 0
        fi

        echo "::error::${GATING_MATCHES} finding(s) at or above" \
          "'${FAIL_ON}'. See the job summary for the affected" \
          "packages and CVEs."
        exit 1
